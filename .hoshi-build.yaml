# hoshi-build 設定。規範見 hoshi-platform-standards engineering/build.md §2，
# 鍵位參考見 hoshi-build 的 docs/config.md。
#
# 靜態站，沒有後端；產物就是 dist/ 底下那疊靜態檔。
# `npm run build`（＝ astro check && astro build）本來就寫進 dist/，
# 所以 hoshi-build 不會有複製動作。
#
# `test` 不寫：type: npm 的預設就是跑 `npm run build`，而 astro check 已經在
# 那條 script 裡——重寫一次預設值只是多一個會和工具漂移的東西。
# `npm run fonts` **刻意不收進來**：它是字型子集化的**內容產生**步驟，
# 產物（public/fonts/*.woff2）進版控，只在字集變動時跑一次；它需要 python3、
# fonttools 與對外網路，收進驗證流程會讓每一次 hoshi test 都多背這些相依，
# 而它一個字都驗不到。
name: hoshivel-web
type: npm
output: dist/

dev:
    open: http://localhost:26820
    processes:
      - name: web
        run: npm run dev
        # 26820 是本站在埠計畫裡的區塊（26820-26829，平臺與業務服務），
        # 不是 astro 的預設 4321。純靜態站不進 hoshi-deploy 的 inventory
        # `nodes`——它由 Cloudflare 建置與服務，不落在任何節點上——但 dev
        # server 仍然和其他倉庫搶同一臺開發機上的號碼，所以號碼取自同一份計畫。
        #
        # 這裡原本指名「Cloudflare Pages」。不落在節點上是對的，產品名沒有
        # 查證過（wrangler.jsonc 是 assets.directory 的形狀，不是 Pages 的鍵），
        # 所以拿掉。實際是 Pages 專案還是 Worker 見 workspace 的
        # todo/sr-web-與-hoshivel-web-的部署路徑.md。
        #
        # **只列一個。** 先前寫 `[4321, 4322]`，是因為本站與 sr-web 都停在
        # astro 預設值，4321 被占用時 astro 會自己滑到 4322。那份宣告擋住了
        # 「-open 開到別人的伺服器」，卻沒有解決兩站相撞本身：實測先開 sr-web
        # 再開本站，本站落在 4322，而 `hoshi dev` 宣告 4321 被占用、直接拒絕
        # 啟動。現在埠寫在 astro.config.mjs 且 strictPort，滑不動了。
        ports: [ 26820 ]
