<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Hoshivel — 少做，做好，做久">
  <!-- 紙面 -->
  <rect width="1200" height="630" fill="#f6f3ea" />
  <!-- 上下髮絲框（編輯部的版心） -->
  <rect x="96" y="88" width="1008" height="1" fill="#beb69f" />
  <rect x="96" y="520" width="1008" height="1" fill="#beb69f" />

  <!-- 眉標 -->
  <text x="96" y="72" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-weight="500" font-size="17" letter-spacing="8" fill="#5d6067">獨立遊戲與網路服務開發組織</text>

  <!-- 字標（明體）＋標語 -->
  <text x="92" y="280" font-family="Noto Serif CJK TC, Noto Serif TC, Georgia, serif" font-weight="600" font-size="104" letter-spacing="2" fill="#17181c">Hoshivel</text>
  <text x="96" y="374" font-family="Noto Serif CJK TC, Noto Serif TC, serif" font-weight="600" font-size="44" letter-spacing="14" fill="#26282d">少做，做好，做久</text>
  <text x="96" y="428" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-weight="400" font-size="22" letter-spacing="3" fill="#5d6067">Build less, build well, build to last</text>

  <!-- 朱印（右下落款位） -->
  <g transform="translate(1010 396)">
    <rect width="94" height="94" rx="16" fill="#b23a26" />
    <rect x="10" y="10" width="74" height="74" rx="10" fill="none" stroke="#fdfbf5" stroke-opacity="0.55" stroke-width="2.6" />
    <path d="M47 20 C 50 33.8 60.2 44 74 47 C 60.2 50 50 60.2 47 74 C 44 60.2 33.8 50 20 47 C 33.8 44 44 33.8 47 20 Z" fill="#fdfbf5" />
  </g>

  <!-- 直書落款（朱印左側的細字：名字的由來） -->
  <text x="968" y="398" font-family="Noto Serif CJK TC, Noto Serif TC, serif" font-weight="500" font-size="19" letter-spacing="9" fill="#5d6067" writing-mode="tb">以星為帆</text>

  <!-- 基線列 -->
  <text x="96" y="566" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-weight="500" font-size="19" letter-spacing="6" fill="#5d6067">HOSHIVEL.COM</text>
  <text x="1104" y="566" text-anchor="end" font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif" font-weight="500" font-size="19" letter-spacing="4" fill="#5d6067">碎界 SHATTERED REALMS · HOSHI ID</text>
</svg>
